name: E-commerce CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  deploy-to-production:
    runs-on: ubuntu-latest
    environment: E-commerce

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "ap-southeast-1"
      TARGET_S3_BUCKET: ${{ secrets.TARGET_S3_BUCKET }}
      S3_ATHENA_RESULT: ${{ secrets.S3_ATHENA_RESULT }}
      S3_BUCKET_FINAL_RESULT: ${{ secrets.S3_BUCKET_FINAL_RESULT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: "ap-southeast-1"

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.aws_access_key_id }}
          aws-secret-access-key: ${{ env.aws_secret_access_key }}
          aws-region: ap-southeast-1
  
      - name: setup terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform apply
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve

